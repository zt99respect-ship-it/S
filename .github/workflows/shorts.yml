name: Generate Shorts

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'رابط فيديو يوتيوب'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp google-generativeai

      - name: Run Shorts Maker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py "${{ github.event.inputs.youtube_url }}"

      - name: Upload Shorts Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: shorts-videos
          path: output_shorts/

